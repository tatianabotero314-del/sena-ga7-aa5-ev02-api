name: Verificar API con coleccion Postman
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Incorporar proyecto y coleccion
        run: |
          if [ ! -f pom.xml ]; then
            python3 - <<'PYCODE'
          import base64,io,zipfile
          zipfile.ZipFile(io.BytesIO(base64.b64decode(""))).extractall('.')
          PYCODE
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src docs tests postman pom.xml package.json package-lock.json playwright.config.js README.md .gitignore
          git diff --cached --quiet || git commit -m "Versionar API y coleccion Postman con diez escenarios"
          git push
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B verify
      - name: Iniciar API real
        run: |
          java -jar target/servicios-registro-login-1.0.0.jar --spring.datasource.url='jdbc:h2:mem:postman;DB_CLOSE_DELAY=-1' > servicio.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8080/api/salud; then exit 0; fi
            sleep 2
          done
          exit 1
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Ejecutar coleccion Postman con Newman
        run: |
          npm install --no-save newman@6.2.1
          npx newman run postman/AA5_EV02.postman_collection.json --reporters cli,json,junit --reporter-json-export resultados/newman.json --reporter-junit-export resultados/newman.xml | tee resultados-newman.txt
        shell: bash -eo pipefail {0}
      - name: Preparar entregables verificables
        if: always()
        run: |
          git bundle create historial-github.bundle --all
          zip -r fuentes.zip src docs tests postman pom.xml package.json package-lock.json playwright.config.js README.md .gitignore .github
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: API-AA5-EV02
          path: |
            target/servicios-registro-login-1.0.0.jar
            target/surefire-reports
            resultados
            resultados-newman.txt
            servicio.log
            fuentes.zip
            historial-github.bundle
